<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Anmelden — DEIN NAME</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page-bg">
  <img class="bg-gif" src="assets/background.gif" alt="" />
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="scrim"></div>
</div>

<main class="frame">
  <div class="wrap login-wrap">
    <div class="login-card">
      <span class="icon-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </span>
      <h1>Anmelden</h1>
      <p class="lead">Bitte melde dich an, um dieses Tool zu nutzen.</p>
      <input class="field" type="text" placeholder="Benutzername" />
      <input class="field" type="password" placeholder="Passwort" />
      <button class="btn btn-grad btn-wide" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg>
        Anmelden
      </button>
      <a class="login-back" href="tools.html">← Zurück zu Tools</a>
    </div>
  </div>
</main>

</body>
</html>
